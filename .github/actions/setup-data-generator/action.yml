name: Set up the data generator
description: Set up Python and install the data generator dependencies.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      id: python
      with:
        python-version-file: .python-version

    # The venv links to the Python install, so the key includes its exact version.
    - name: Cache the virtual environment
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: venv
      with:
        path: ~/.venv
        key: data-generator-venv-${{ runner.os }}-${{ runner.arch }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements_base.txt', 'requirements_generate_data.txt', 'constraints.txt') }}

    # scripts/install/frontend pins the version and skips the download when it is already present.
    - name: Cache the frontend
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: custom_components/hacs/hacs_frontend
        key: data-generator-frontend-${{ hashFiles('scripts/install/frontend') }}

    - name: Activate the virtual environment
      shell: bash
      run: |
        echo "VIRTUAL_ENV=$HOME/.venv" >> "$GITHUB_ENV"
        echo "$HOME/.venv/bin" >> "$GITHUB_PATH"

    - name: Install dependencies
      if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      run: |
        python3 -m venv "$VIRTUAL_ENV"
        scripts/install/pip_packages --requirement requirements_generate_data.txt

    - name: Install the frontend
      shell: bash
      run: scripts/install/frontend
