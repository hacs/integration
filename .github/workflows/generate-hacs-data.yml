name: Generate HACS Data

on:
  workflow_dispatch:
    inputs:
      forceRepositoryUpdate:
        description: 'Force repository update'
        required: false
        default: 'False'
        type: choice
        options:
          - "False"
          - "True"
      category:
        description: 'Select a category'
        required: false
        type: choice
        options:
          - None
          - appdaemon
          - integration
          - plugin
          - python_script
          - template
          - theme
      dryRun:
        description: 'Dry run (generate and summarize only, do not publish)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */4 * * *"

concurrency:
  group: category-data

permissions: {}

jobs:
  generate-matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    if: github.repository == 'hacs/integration'
    outputs:
      categories: ${{ steps.set-matrix.outputs.categories }}
    steps:
      - id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CATEGORY: ${{ inputs.category }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] && [[ "$INPUT_CATEGORY" != "None" ]] && [[ -n "$INPUT_CATEGORY" ]]; then
            categories=("$INPUT_CATEGORY")
          else
            categories=(appdaemon integration plugin python_script template theme)
          fi
          categories_json=$(printf '%s\n' "${categories[@]}" | jq -R . | jq -cs .)
          echo "categories=$categories_json" >> $GITHUB_OUTPUT
          echo "categories: $categories_json"

  # Fetches the published data once so every category leg uses the same
  # baseline. Trade-off: if any fetch keeps failing, this job fails and blocks
  # the whole run, not just that category.
  fetch-stored-data:
    name: Fetch stored data
    runs-on: ubuntu-latest
    needs: generate-matrix
    if: github.repository == 'hacs/integration'
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.fetch.outputs.shards }}
      shard_counts: ${{ steps.fetch.outputs.shard_counts }}
    steps:
      - name: Fetch stored data
        id: fetch
        env:
          CATEGORIES: ${{ needs.generate-matrix.outputs.categories }}
        run: |
          mkdir -p outputdata/stored

          fetch_stored_hacs_content() {
            curl \
              --silent --show-error --fail --retry 5 --retry-all-errors \
              --connect-timeout 10 --max-time 60 \
              --header "User-Agent: HACS/Generator" \
              "https://data-v2.hacs.xyz/$1" \
              --output "$2"
          }

          # Repositories are assigned to shards by a hash of their name, so shard
          # sizes spread around the average; sizing for 800 keeps each at about 850.
          shards="[]"
          shard_counts="{}"
          for category in $(echo "$CATEGORIES" | jq -r '.[]'); do
            echo "Fetching stored data for $category"
            fetch_stored_hacs_content "${category}/data.json" "outputdata/stored/${category}.json"

            count=$(jq 'length' "outputdata/stored/${category}.json")
            total=$(( count > 0 ? (count + 799) / 800 : 1 ))
            echo "$category: $count repositories in $total shard(s)"
            shards=$(jq -c --arg category "$category" --argjson total "$total" \
              '. + [range(1; $total + 1) | {category: $category, shard: ., shards: $total}]' <<< "$shards")
            shard_counts=$(jq -c --arg category "$category" --argjson total "$total" \
              '. + {($category): $total}' <<< "$shard_counts")
          done
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "shard_counts=$shard_counts" >> "$GITHUB_OUTPUT"

          echo "Fetching removed repositories"
          fetch_stored_hacs_content "removed/repositories.json" "outputdata/stored/removed.json"

      - name: Upload stored data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stored-data
          path: outputdata/stored
          if-no-files-found: error
          retention-days: 1

  category-data:
    runs-on: ubuntu-latest
    needs: [generate-matrix, fetch-stored-data]
    if: github.repository == 'hacs/integration'
    name: Generate ${{ matrix.category }} data (${{ matrix.shard }}/${{ matrix.shards }})
    environment: data-generator
    # The app token expires after 1 hour and is created after the setup steps,
    # so the job always stops before the token expires.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON( needs.fetch-stored-data.outputs.shards )}}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements_base.txt
            requirements_generate_data.txt

      - name: Install dependencies
        run:  |
          scripts/install/frontend
          scripts/install/pip_packages --requirement requirements_generate_data.txt

      - name: Download stored data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stored-data
          path: outputdata/stored

      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DATA_GENERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_GENERATOR_APP_PEM }}

      - name: Generate ${{ matrix.category }} data (${{ matrix.shard }}/${{ matrix.shards }})
        run: python3 -m scripts.data.generate_category_data ${{ matrix.category }} --shard ${{ matrix.shard }}/${{ matrix.shards }}
        env:
          DATA_GENERATOR_TOKEN: ${{ steps.token.outputs.token }}
          FORCE_REPOSITORY_UPDATE: ${{ inputs.forceRepositoryUpdate }}
          HACS_STORED_DATA_DIR: outputdata/stored

      - name: Upload shard data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-${{ matrix.category }}-${{ matrix.shard }}
          path: outputdata/_shards/${{ matrix.category }}
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [generate-matrix, fetch-stored-data, category-data]
    if: ${{ !cancelled() && needs.fetch-stored-data.result == 'success' && github.repository == 'hacs/integration' }}
    name: Merge ${{ matrix.category }} data
    environment: data-generator
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON( needs.generate-matrix.outputs.categories )}}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements_base.txt
            requirements_generate_data.txt

      - name: Install dependencies
        run:  |
          scripts/install/frontend
          scripts/install/pip_packages --requirement requirements_generate_data.txt

      - name: Download stored data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stored-data
          path: outputdata/stored

      - name: Download shard data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-${{ matrix.category }}-*
          path: outputdata/_shards/${{ matrix.category }}
          merge-multiple: true

      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DATA_GENERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_GENERATOR_APP_PEM }}

      - name: Merge ${{ matrix.category }} data
        run: python3 -m scripts.data.merge_category_data ${{ matrix.category }} --shards ${{ fromJSON(needs.fetch-stored-data.outputs.shard_counts)[matrix.category] }}
        env:
          DATA_GENERATOR_TOKEN: ${{ steps.token.outputs.token }}
          HACS_STORED_DATA_DIR: outputdata/stored

      - name: Validate output with JQ
        run: |
          jq -c . outputdata/${{ matrix.category }}/data.json
          jq -c . outputdata/${{ matrix.category }}/repositories.json

      - name: Validate output with schema
        run: |
          python3 -m scripts.data.validate_category_data ${{ matrix.category }} outputdata/${{ matrix.category }}/data.json

      - name: Generate diff
        run: |
          diff -U 8 outputdata/diff/${{ matrix.category }}_before.json outputdata/diff/${{ matrix.category }}_after.json > outputdata/diff/${{ matrix.category }}.diff || true
          cat outputdata/diff/${{ matrix.category }}.diff

      - name: Upload diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CATEGORY: ${{ matrix.category }}
        with:
          script: |
            const fs = require('fs');
            const diffContents = fs.readFileSync(`outputdata/diff/${process.env.CATEGORY}.diff`);

            core.summary.addDetails(`${process.env.CATEGORY}.diff contents`, `\n\n\`\`\`diff\n${diffContents}\`\`\`\n\n`)
            core.summary.write()

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.category }}
          path: |
            outputdata/${{ matrix.category }}
            outputdata/summary.json
            outputdata/diff
          if-no-files-found: error
          retention-days: 7

  summarize:
    name: Summarize
    runs-on: ubuntu-latest
    needs: [generate-matrix, merge]
    if: ${{ always() && github.repository == 'hacs/integration' }}
    outputs:
      changedCategories: ${{ steps.combined.outputs.changedCategories }}
      environments: ${{ steps.combined.outputs.environments }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: outputdata

      - name: Generate combined summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: combined
        env:
          HACS_CHANGED_PCT_TARGET: ${{ vars.HACS_CHANGED_PCT_TARGET }}
          HACS_DIFF_TARGET: ${{ vars.HACS_DIFF_TARGET }}
          CATEGORIES: ${{ needs.generate-matrix.outputs.categories }}
        with:
          script: |
            const fs = require('fs');
            const summaries = {};
            const changedCategories = [];
            const environments = {};
            const diffTarget = Number(process.env.HACS_DIFF_TARGET || 1)

            core.info(`[global] diffTarget: ${diffTarget}`);

            // Only consider the expected category directories that produced a
            // summary -- ignores the stored-data artifact and any category
            // whose leg failed to write one.
            const categories = JSON.parse(process.env.CATEGORIES);
            const subDirectories = categories.filter(
                category => fs.existsSync(`outputdata/${category}/summary.json`)
            )

            for (const directory of subDirectories) {
              let changedPctTarget = Number(process.env.HACS_CHANGED_PCT_TARGET)
              const parsed = JSON.parse(fs.readFileSync(`outputdata/${directory}/summary.json`))

              if (!changedPctTarget) {
                if (!parsed.new_count || parsed.new_count <= 0) {
                  changedPctTarget = 0;
                } else if (directory === "integration") {
                    changedPctTarget = 10;
                } else if (parsed.new_count > 750) {
                    changedPctTarget = 7;
                } else if (parsed.new_count > 500) {
                    changedPctTarget = 8;
                } else if (parsed.new_count > 250) {
                    changedPctTarget = 9;
                } else if (parsed.new_count > 100) {
                    changedPctTarget = 10;
                } else if (parsed.new_count > 75) {
                    changedPctTarget = 15;
                } else if (parsed.new_count > 50) {
                    changedPctTarget = 20;
                } else if (parsed.new_count > 25) {
                    changedPctTarget = 25;
                } else if (parsed.new_count > 10) {
                    changedPctTarget = 28;
                } else {
                    changedPctTarget = 50;
                }
              }

              core.info(`[${directory}] changedPctTarget: ${changedPctTarget}`);

              if (parsed.changed >= 1 || parsed.diff >= 1) {
                changedCategories.push(directory)
              }

              if (parsed.changed_pct >= changedPctTarget) {
                core.warning(`${directory} changed ${parsed.changed_pct}%!`)
                environments[directory] = `publish-${directory}-verify`;
              }

              if (parsed.diff >= diffTarget) {
                core.warning(`${directory} changed ${parsed.diff}!`)
                environments[directory] = `publish-${directory}-verify`;
              }

              summaries[directory] = JSON.parse(fs.readFileSync(`outputdata/${directory}/summary.json`));
            }

            core.summary.addCodeBlock(JSON.stringify({summaries, environments, changedCategories}, null, 4), "json")
            core.summary.write()
            core.setOutput("changedCategories", JSON.stringify(changedCategories))
            core.setOutput("environments", environments)

      - name: Send notification
        if: ${{ steps.combined.outputs.environments != '{}' }}
        run: |
          curl \
            -H "Content-Type: application/json" \
            -d '{"username": "GitHub action", "content": "[Attention needed!](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}})"}' \
            ${{ secrets.DISCORD_WEBHOOK_ACTION_FAILURE }}

  publish:
    runs-on: ubuntu-latest
    needs: summarize
    if: ${{ !cancelled() && needs.summarize.result == 'success' && github.repository == 'hacs/integration' && !(inputs.dryRun == true || inputs.dryRun == 'true') }}
    name: Publish ${{ matrix.category }} data
    environment: ${{ fromJSON(needs.summarize.outputs.environments)[matrix.category] }}
    strategy:
      fail-fast: false
      matrix:
        category: ${{ fromJSON(needs.summarize.outputs.changedCategories) }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements_base.txt
            requirements_generate_data.txt

      - name: Install dependencies
        run:  |
          scripts/install/frontend
          scripts/install/pip_packages --requirement requirements_generate_data.txt

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.category }}
          path: outputdata

      - name: Validate output with JQ
        run: |
          jq -c . outputdata/${{ matrix.category }}/data.json
          jq -c . outputdata/${{ matrix.category }}/repositories.json

      - name: Validate output with schema
        run: |
          python3 -m scripts.data.validate_category_data ${{ matrix.category }} outputdata/${{ matrix.category }}/data.json

      - name: Upload to R2
        run: |
          aws s3 sync \
            outputdata/${{ matrix.category }} \
            s3://data-v2/${{ matrix.category }} \
            --endpoint-url ${{ secrets.CF_R2_ENDPOINT_DATA }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}

      - name: Bust Cloudflare cache
        run: |
          curl --silent --show-error --fail -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_BUST_CACHE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files": ["https:\/\/data-v2.hacs.xyz\/${{ matrix.category }}\/data.json", "https:\/\/data-v2.hacs.xyz\/${{ matrix.category }}\/repositories.json"]}'

  notify_on_failure:
    runs-on: ubuntu-latest
    name: Trigger Discord notification when jobs fail
    needs: ["generate-matrix", "fetch-stored-data", "category-data", "merge", "summarize", "publish"]
    if: ${{ always() && github.repository == 'hacs/integration' && contains(join(needs.*.result, ','), 'failure') && github.event_name == 'schedule' }}
    steps:
      - name: Send notification
        run: |
          curl \
            -H "Content-Type: application/json" \
            -d '{"username": "GitHub action failure", "content": "[Scheduled action failed!](https://github.com/${{github.repository}}/actions/runs/${{github.run_id}})"}' \
            ${{ secrets.DISCORD_WEBHOOK_ACTION_FAILURE }}
