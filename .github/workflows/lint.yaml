name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  matrix:
    runs-on: ubuntu-latest
    name: Run ${{ matrix.check }}
    strategy:
      matrix:
        check:
          - check-ast
          - check-executables-have-shebangs
          - check-json
          - codespell
          - isort
          - mixed-line-ending
          - pyupgrade
          - requirements-txt-fixer
          - ruff-check
          - ruff-format
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements_base.txt
            requirements_lint.txt

      - name: Install dependencies
        run: |
          scripts/install/pip_packages --requirement requirements_lint.txt
          pre-commit install-hooks --config .github/pre-commit-config.yaml

      - name: Run the check (${{ matrix.check }})
        run: pre-commit run --show-diff-on-failure --hook-stage manual ${{ matrix.check }} --all-files --config .github/pre-commit-config.yaml

  lint-json:
    runs-on: ubuntu-latest
    name: With JQ
    steps:
    - name: Checkout the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Run validation
      run: jq -r -e -c . tests/fixtures/*.json